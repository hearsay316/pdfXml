[package]
name = "pdfxml-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI for converting XFDF/PDF annotations"
license = "MIT"
publish = false

[dependencies]
pdfxml = { path = "..", version = "0.1.1" }
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
rfd = "0.15"
futures = "0.3"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[[bin]]
name = "pdfxml-gui"
path = "src/main.rs"
